{
  "name": "Phase 3 cumulative CI",
  "on": {
    "pull_request": {
      "branches": [
        "main"
      ],
      "types": [
        "opened",
        "synchronize",
        "reopened",
        "ready_for_review"
      ]
    },
    "push": {
      "branches": [
        "main"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "phase3-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "scaffold": {
      "name": "analytical core (${{ matrix.os }}, Python ${{ matrix.python }})",
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 40,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": [
            "ubuntu-24.04",
            "windows-2025"
          ],
          "python": [
            "3.11",
            "3.13"
          ]
        }
      },
      "env": {
        "PYTHONDONTWRITEBYTECODE": "1",
        "PYTEST_DISABLE_PLUGIN_AUTOLOAD": "1",
        "PIP_DISABLE_PIP_VERSION_CHECK": "1",
        "PIP_NO_INPUT": "1",
        "PYTHONUTF8": "1",
        "SIT_REVIEW_HEAD": "${{ github.event.pull_request.head.sha || github.sha }}",
        "SIT_MATRIX_OS": "${{ matrix.os }}",
        "SIT_MATRIX_PYTHON": "${{ matrix.python }}"
      },
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "steps": [
        {
          "name": "Checkout exact candidate without stored credentials",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.event.pull_request.head.sha || github.sha }}",
            "fetch-depth": 0,
            "persist-credentials": false,
            "submodules": false,
            "lfs": false
          }
        },
        {
          "name": "Select reviewed CPython minor",
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "${{ matrix.python }}",
            "architecture": "x64",
            "check-latest": false,
            "allow-prereleases": false
          }
        },
        {
          "name": "Check actual checkout and guards",
          "run": "python -B tests/scaffold/test_ci_contract.py --ci-stage preflight"
        },
        {
          "name": "Review and install pinned development wheels",
          "run": "python -B tests/scaffold/test_ci_contract.py --ci-stage prepare"
        },
        {
          "name": "Collect and run all cumulative tests",
          "run": "python -B tests/scaffold/test_ci_contract.py --ci-stage test"
        },
        {
          "name": "Record results, archives and unchanged checkout",
          "if": "${{ always() }}",
          "run": "python -B tests/scaffold/test_ci_contract.py --ci-stage evidence"
        },
        {
          "name": "Preserve verification records only",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "phase3-${{ matrix.os }}-py${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/sit-p3/evidence/*.json\n${{ runner.temp }}/sit-p3/evidence/*.xml\n${{ runner.temp }}/sit-p3/evidence/*.log",
            "if-no-files-found": "error",
            "include-hidden-files": false,
            "overwrite": false,
            "retention-days": 14
          }
        }
      ]
    }
  }
}
